AWSTemplateFormatVersion: '2010-09-09'
Description: HTTPS hosting for the collector using a private S3 bucket and CloudFront OAC.

Resources:
  CollectorBucket:
    Type: AWS::S3::Bucket
    # スタック削除・置換時にも配信ファイルを保持する。
    DeletionPolicy: Retain
    UpdateReplacePolicy: Retain
    Properties:
      OwnershipControls:
        Rules:
          - ObjectOwnership: BucketOwnerEnforced
      PublicAccessBlockConfiguration:
        BlockPublicAcls: true
        IgnorePublicAcls: true
        BlockPublicPolicy: true
        RestrictPublicBuckets: true
      BucketEncryption:
        ServerSideEncryptionConfiguration:
          - ServerSideEncryptionByDefault:
              SSEAlgorithm: AES256

  CollectorOriginAccessControl:
    Type: AWS::CloudFront::OriginAccessControl
    Properties:
      OriginAccessControlConfig:
        Name: !Ref CollectorBucket
        Description: Signed access to the private collector bucket
        OriginAccessControlOriginType: s3
        SigningBehavior: always
        SigningProtocol: sigv4

  CollectorCachePolicy:
    Type: AWS::CloudFront::CachePolicy
    Properties:
      CachePolicyConfig:
        Name: !Ref CollectorBucket
        Comment: Honor HTML no-cache and cache hashed assets
        MinTTL: 0
        DefaultTTL: 86400
        MaxTTL: 31536000
        ParametersInCacheKeyAndForwardedToOrigin:
          EnableAcceptEncodingGzip: true
          EnableAcceptEncodingBrotli: true
          CookiesConfig:
            CookieBehavior: none
          HeadersConfig:
            HeaderBehavior: none
          QueryStringsConfig:
            QueryStringBehavior: none

  CollectorDistribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: Collector HTTPS frontend
        Enabled: true
        IPV6Enabled: true
        HttpVersion: http2
        PriceClass: PriceClass_200
        DefaultRootObject: index.html
        Origins:
          - Id: collector-s3
            DomainName: !GetAtt CollectorBucket.RegionalDomainName
            OriginAccessControlId: !GetAtt CollectorOriginAccessControl.Id
            S3OriginConfig:
              OriginAccessIdentity: ''
        DefaultCacheBehavior:
          TargetOriginId: collector-s3
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: !Ref CollectorCachePolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true

  CollectorBucketPolicy:
    Type: AWS::S3::BucketPolicy
    Properties:
      Bucket: !Ref CollectorBucket
      PolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Sid: AllowCollectorCloudFrontRead
            Effect: Allow
            Principal:
              Service: cloudfront.amazonaws.com
            Action: s3:GetObject
            Resource: !Sub '${CollectorBucket.Arn}/*'
            Condition:
              StringEquals:
                AWS:SourceArn: !Sub 'arn:${AWS::Partition}:cloudfront::${AWS::AccountId}:distribution/${CollectorDistribution}'

Outputs:
  BucketName:
    Description: BucketName argument for scripts/deploy-collector.ps1
    Value: !Ref CollectorBucket
  DistributionId:
    Description: DistributionId argument for scripts/deploy-collector.ps1
    Value: !Ref CollectorDistribution
  CollectorUrl:
    Description: Collector URL (available after uploading the build)
    Value: !Sub 'https://${CollectorDistribution.DomainName}/'
