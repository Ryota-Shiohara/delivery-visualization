AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Description: >
  Delivery Visualization - Measurement ingestion API
  API Gateway -> Lambda -> DynamoDB

Resources:

  MeasurementsTable:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: delivery-testDB
      BillingMode: PAY_PER_REQUEST
      StreamSpecification:
        StreamViewType: NEW_IMAGE

      AttributeDefinitions:
        - AttributeName: measurementId
          AttributeType: S

      KeySchema:
        - AttributeName: measurementId
          KeyType: HASH


  DeliveryApi:
    Type: AWS::Serverless::Api
    Properties:
      Name: deliveryMeasurementAPI
      StageName: dev

      EndpointConfiguration:
        Type: REGIONAL

      Cors:
        AllowOrigin: "'*'"
        AllowMethods: "'POST,OPTIONS'"
        AllowHeaders: "'Content-Type'"


  SaveMeasurementFunction:
    Type: AWS::Serverless::Function
    Properties:
      FunctionName: deliverySaveMeasurement

      Runtime: python3.14
      CodeUri: ../services/ingestion/
      Handler: lambda_B.lambda_handler

      MemorySize: 128
      Timeout: 10

      Role:
        Fn::Sub: arn:aws:iam::${AWS::AccountId}:role/LabRole

      Environment:
        Variables:
          TABLE_NAME: !Ref MeasurementsTable

      Events:
        PostMeasurements:
          Type: Api
          Properties:
            RestApiId: !Ref DeliveryApi
            Path: /measurements
            Method: POST


Outputs:

  MeasurementApiUrl:
    Description: Measurement POST endpoint
    Value:
      Fn::Sub:
        - https://${ApiId}.execute-api.${AWS::Region}.amazonaws.com/dev/measurements
        - ApiId: !Ref DeliveryApi

  MeasurementsTableName:
    Description: DynamoDB measurements table
    Value: !Ref MeasurementsTable

  MeasurementsStreamArn:
    Value: !GetAtt MeasurementsTable.StreamArn

  SaveMeasurementFunctionName:
    Description: Measurement ingestion Lambda function
    Value: !Ref SaveMeasurementFunction
